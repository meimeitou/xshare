[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xshare"
version = "0.1.0"
description = "股票/基金智能分析助手 - MCP Tools for nanobot"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "akshare>=1.10.0",
    "tushare>=1.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "mineru-kie-sdk>=0.1.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pypinyin>=0.52.0",
    "swagger-ui-bundle>=1.1.0",
]

[project.scripts]
xshare = "xshare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["xshare"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mcp[cli]>=1.0.0",
]
